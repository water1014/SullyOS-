name: Build signed Android migration and release APKs

on:
  push:
    branches:
      - feature/image-studio
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sullyos-signed-android-release
  cancel-in-progress: false

jobs:
  android-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/image-studio

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Validating the newly configured SullyOS release signing key."
          mkdir -p "$RUNNER_TEMP/sullyos-signing"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sullyos-signing/release.jks"; then
            echo "::error::Keystore secret is not valid Base64. Re-copy the original Base64 value without adding quotes."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/sullyos-signing/release.jks"
          KEYSTORE_SIZE=$(wc -c < "$RUNNER_TEMP/sullyos-signing/release.jks" | tr -d ' ')
          if [ "$KEYSTORE_SIZE" -lt 500 ]; then
            echo "::error::Decoded keystore is unexpectedly small ($KEYSTORE_SIZE bytes). The Base64 secret may be truncated."
            exit 1
          fi
          echo "Decoded keystore file size: $KEYSTORE_SIZE bytes."
          if ! keytool -list -keystore "$RUNNER_TEMP/sullyos-signing/release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" >"$RUNNER_TEMP/sullyos-signing/keytool-store.log" 2>&1; then
            echo "::error::Keystore could not be opened. Check the diagnostic below; no secret values are printed."
            tail -n 12 "$RUNNER_TEMP/sullyos-signing/keytool-store.log"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/sullyos-signing/release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>"$RUNNER_TEMP/sullyos-signing/keytool-alias.log"; then
            echo "::error::Keystore password is accepted, but ANDROID_KEY_ALIAS was not found. Check the alias secret."
            sed -E 's/(password|passphrase)[^:]*:.*/\1: [redacted]/I' "$RUNNER_TEMP/sullyos-signing/keytool-alias.log" | tail -n 8
            exit 1
          fi
          echo "Keystore password and alias validation passed."
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sullyos-signing/release.jks" >> "$GITHUB_ENV"
          echo "APKSIGNER_PATH=$ANDROID_HOME/build-tools/35.0.0/apksigner" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed debuggable migration APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_VERSION_CODE=$((400000 + GITHUB_RUN_NUMBER * 2 + 1))
          export ANDROID_VERSION_NAME=3.20.0-migration
          pnpm build:capacitor:migration

      - name: Verify migration APK identity, signer, and debuggability
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.aetheros.simulator'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "application-debuggable"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload migration APK
        uses: actions/upload-artifact@v4
        with:
          name: sullyos-migration-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build signed final release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_VERSION_CODE=$((400000 + GITHUB_RUN_NUMBER * 2 + 2))
          export ANDROID_VERSION_NAME=3.20.0
          pnpm build:capacitor:release

      - name: Verify final release package and signer
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.aetheros.simulator'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::Final release APK must not be debuggable"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload final release APK
        uses: actions/upload-artifact@v4
        with:
          name: sullyos-android-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish final APK under a direct-install artifact name
        uses: actions/upload-artifact@v4
        with:
          name: sullyos-final-install-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
