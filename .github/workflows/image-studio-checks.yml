name: Image Studio checks

on:
  push:
    branches:
      - feature/image-studio
  pull_request:
    branches:
      - master

# Keep only the newest verification for this branch when several small commits land together.
concurrency:
  group: image-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: companion_test
          POSTGRES_PASSWORD: companion_test_password
          POSTGRES_DB: companion_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U companion_test -d companion_sync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Android APK installer integration contract
        run: pnpm check:android-installer
      - name: Check companion sync backend syntax
        run: pnpm check:companion-sync
      - name: Validate companion sync Compose configuration
        run: |
          cp server/companion-sync/.env.example server/companion-sync/.env
          docker compose --env-file server/companion-sync/.env -f server/companion-sync/compose.yaml config --quiet
          rm server/companion-sync/.env
      - name: Check VPS deployment script syntax
        run: bash -n server/companion-sync/deploy.sh
      - name: Build companion sync production image
        run: docker build -f server/companion-sync/Dockerfile -t sullyos-companion-sync:ci .
      - name: Run companion sync PostgreSQL integration test
        env:
          DATABASE_URL: postgresql://companion_test:companion_test_password@127.0.0.1:5432/companion_sync_test
          PGSSLMODE: disable
        run: pnpm test:companion-sync-integration
      - name: Parse Android PowerShell integration scripts
        shell: pwsh
        run: |
          $files = @('scripts/install-apk-installer.ps1', 'scripts/install-secure-storage.ps1', 'scripts/sync-tiao-capacitor.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed: $file"
            }
            Write-Host "PowerShell syntax OK: $file"
          }
      - name: Run tests
        run: pnpm exec vitest run utils/imageGeneration.test.ts utils/blobGc.test.ts utils/visualCompanion/identityPrompt.test.ts utils/visualCompanion/data.test.ts utils/visualCompanion/repository.test.ts utils/visualCompanion/autonomyPolicy.test.ts utils/visualCompanion/autonomySettings.test.ts utils/apiConfigNormalize.test.ts utils/characterApi.test.ts utils/apiPresetSwitch.test.ts utils/localSyncStore.test.ts utils/androidSecureStorage.test.ts utils/companionSyncClient.test.ts server/companion-sync/protocol.test.ts utils/androidAppUpdate.test.ts utils/androidUpdateSession.test.ts utils/androidUpdateControl.test.ts utils/worldbook.test.ts utils/contextWorldbook.test.ts utils/worldbookPersistence.test.ts utils/visualCompanion/referenceAsset.test.ts utils/openCodeGoTransport.test.ts utils/llmEndpoint.test.ts utils/visionApi.test.ts utils/apiConfigNormalize.test.ts utils/tavernPromptPreset.test.ts utils/visionApi.test.ts
      - name: Check first-party Android build scripts and screen awareness privacy contract
        run: node --check scripts/install-capacitor-android-plugins.mjs && node --check scripts/build-capacitor-android.mjs && node scripts/check-android-screen-awareness.mjs
      - name: Build production app
        run: pnpm build
      - name: Setup Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build first-party Capacitor Android debug package (test build)
        run: pnpm build:capacitor:apk
      # This repository is public. The user explicitly approved publishing a downloadable test APK artifact.
      # Anyone who can access this repository's Actions page can download this debug APK.
      - name: Upload installable Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: sullyos-android-test-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
