name: Image Studio checks

on:
  push:
    branches:
      - feature/image-studio
  pull_request:
    branches:
      - master

# Keep only the newest verification for this branch when several small commits land together.
concurrency:
  group: image-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm exec vitest run utils/imageGeneration.test.ts utils/blobGc.test.ts utils/visualCompanion/data.test.ts utils/visualCompanion/repository.test.ts utils/visualCompanion/autonomyPolicy.test.ts utils/visualCompanion/autonomySettings.test.ts utils/apiConfigNormalize.test.ts utils/characterApi.test.ts utils/apiPresetSwitch.test.ts
      - name: Build production app
        run: pnpm build
